# API. O CD do repositório DampCode_API troca a tag :latest pelo SHA do commit antes de aplicar.
apiVersion: v1
kind: Service
metadata:
  name: dampcode-api
  labels:
    app: dampcode-api
spec:
  selector:
    app: dampcode-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dampcode-api
  labels:
    app: dampcode-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dampcode-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dampcode-api
    spec:
      # Só é usado se as imagens do GHCR estiverem privadas (ver docs/deploy-kubernetes.md).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/damp-code/dampcode-api:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dampcode-secrets
                  key: postgres-password
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dampcode-secrets
                  key: mongo-password
            - name: ConnectionStrings__PostgreSql
              value: Host=postgres;Port=5432;Database=dampcode;Username=dampcode;Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__DbConnection
              value: mongodb://dampcode:$(MONGO_PASSWORD)@mongo:27017/damp_code?authSource=admin
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: dampcode-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
