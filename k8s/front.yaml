# Front (nginx). Repassa /api/ para o Service dampcode-api.
# O CD do repositório Damp-Code-Front troca a tag :latest pelo SHA do commit antes de aplicar.
apiVersion: v1
kind: Service
metadata:
  name: dampcode-front
  labels:
    app: dampcode-front
spec:
  selector:
    app: dampcode-front
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dampcode-front
  labels:
    app: dampcode-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dampcode-front
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dampcode-front
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: front
          image: ghcr.io/damp-code/damp-code-front:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://dampcode-api:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
